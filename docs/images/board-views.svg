<text x="598" y="846" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="10.5" fill="#c0398a" font-weight="400" text-anchor="start" opacity="1"><tspan x="598" dy="0">FPC：正面 → 穿线孔 → J1</tspan></text>
<text x="48" y="900" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="48" dy="0">说明</tspan></text>
<text x="48" y="924" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#4a4438" font-weight="400" text-anchor="start" opacity="1"><tspan x="48" dy="0">1. 板厚 2.0 mm，USB-A 插头由 PCB 板边直接成型，无需垫片与连接器。</tspan><tspan x="48" dy="21">2. USB 触点长 12 mm、间距 2 mm；触点区到穿线孔 9 mm，因此穿线孔起于插头端 21 mm 处。</tspan><tspan x="48" dy="21">3. 屏的 FPC 从正面穿过线孔，折到背面插入 J1；J1 紧贴穿线孔靠插头一侧。</tspan><tspan x="48" dy="21">4. 排针焊盘每列 6 个、间距 2.5 mm，首脚为方焊盘；圆心距长边 1.1 mm。2.5 mm 间距与通用 2.54 mm 排针不兼容。</tspan><tspan x="48" dy="21">5. 触摸电极为 6 × 13 mm 的阻焊层下网格铜箔，距板端 1 mm，表面无开窗、无凸起。</tspan><tspan x="48" dy="21">6. ISP 焊盘直径 0.5 mm、圆心间距 1.5 mm，网络为 USB_D+ 与 3.3 V。</tspan></text>
</svg>
