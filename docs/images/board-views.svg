<text x="580" y="846" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="10.5" fill="#c0398a" font-weight="400" text-anchor="start" opacity="1"><tspan x="580" dy="0">FPC：正面 → 穿线孔 → J1</tspan></text>
<text x="48" y="900" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="48" dy="0">说明</tspan></text>
<text x="48" y="924" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#4a4438" font-weight="400" text-anchor="start" opacity="1"><tspan x="48" dy="0">1. 板厚 2.0 mm，USB-A 插头由 PCB 板边直接成型，无需垫片与连接器。</tspan><tspan x="48" dy="21">2. 正面只有三样东西：USB 触点、屏、触摸电极；主控、flash、屏座、焊盘全在背面，位于屏的正后方。</tspan><tspan x="48" dy="21">3. 屏的 FPC 从正面穿过穿线孔，折到背面插入 J1；J1 紧贴穿线孔靠插头一侧。</tspan><tspan x="48" dy="21">4. 两列排针焊盘各 5 个圆孔，穿线孔两侧另有方焊盘；丝印给 JP2、JP3 各标注 6 个网络名，方焊盘是否为第 1 脚待确认。</tspan><tspan x="48" dy="21">5. 触摸电极为阻焊层下的网格铜箔，表面无开窗、无凸起，斜光下呈细密网格反光。</tspan><tspan x="48" dy="21">6. 触摸端居中有一个穿透板面的圆孔，直径未测，正反两面在同一位置。</tspan></text>
</svg>
