<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000">
<rect width="1240" height="1000" fill="#ffffff"/>
<text x="48" y="46" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="24" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="48" dy="0">MSU2_MINI 正反两面</tspan></text>
<text x="48" y="74" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="start" opacity="1"><tspan x="48" dy="0">板长 45.5 mm、板宽 13 mm、板厚 2.0 mm（用户实测）；比例为 1:1，即 20 px = 1 mm</tspan></text>
<text x="48" y="122" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="15" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="48" dy="0">正面（贴屏面）：从左到右依次是 USB 触点、屏、触摸电极</tspan></text>
<rect x="150" y="150" width="910" height="260" rx="8" fill="#f4f1e6" stroke="#5a5346" stroke-width="1.8"/>
<rect x="200" y="202" width="120" height="16" rx="2" fill="#d9b45a" stroke="#8a6d24" stroke-width="1.4"/>
<rect x="200" y="242" width="120" height="16" rx="2" fill="#d9b45a" stroke="#8a6d24" stroke-width="1.4"/>
<rect x="200" y="282" width="120" height="16" rx="2" fill="#d9b45a" stroke="#8a6d24" stroke-width="1.4"/>
<rect x="200" y="322" width="120" height="16" rx="2" fill="#d9b45a" stroke="#8a6d24" stroke-width="1.4"/>
<text x="200" y="142" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#8a6d24" font-weight="400" text-anchor="start" opacity="1"><tspan x="200" dy="0">USB-A 触点 ×4（板边铜箔，6 mm 长，2 mm 间距）</tspan></text>
<rect x="470" y="171" width="434" height="218" rx="6" fill="#ffffff" stroke="#3a6ba8" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="687" y="268" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="14" fill="#3a6ba8" font-weight="400" text-anchor="middle" opacity="1"><tspan x="687" dy="0">屏 160 × 80</tspan></text>
<text x="687" y="294" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#3a6ba8" font-weight="400" text-anchor="middle" opacity="1"><tspan x="687" dy="0">可视区约 21.7 × 10.9 mm</tspan></text>
<rect x="942" y="150" width="118" height="260" rx="4" fill="#f6dfc8" stroke="#b07b3c" stroke-width="1.2"/>
<text x="1001" y="184" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#8a5a24" font-weight="400" text-anchor="middle" opacity="1"><tspan x="1001" dy="0">触摸电极</tspan></text>
<text x="1001" y="204" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11" fill="#8a5a24" font-weight="400" text-anchor="middle" opacity="1"><tspan x="1001" dy="0">13 × 5.9 mm</tspan></text>
<circle cx="1001" cy="280" r="16" fill="#f4f1e6" stroke="#5a5346" stroke-width="1.4"/>
<line x1="150" y1="440" x2="1060" y2="440" stroke="#888" stroke-width="1.4"/>
<line x1="150" y1="432" x2="150" y2="448" stroke="#888" stroke-width="1.4"/>
<line x1="1060" y1="432" x2="1060" y2="448" stroke="#888" stroke-width="1.4"/>
<text x="605" y="462" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#666" font-weight="400" text-anchor="middle" opacity="1"><tspan x="605" dy="0">45.5 mm</tspan></text>
<text x="48" y="522" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="15" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="48" dy="0">背面（贴装面，厂商渲染图即此面）：主控、flash、电源、排针焊盘与屏座</tspan></text>
<rect x="150" y="560" width="910" height="260" rx="8" fill="#f4f1e6" stroke="#5a5346" stroke-width="1.8"/>
<rect x="560" y="610" width="34" height="140" rx="3" fill="#ffffff" stroke="#5a5346" stroke-width="1.4"/>
<text x="578" y="770" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11" fill="#5a5346" font-weight="400" text-anchor="middle" opacity="1"><tspan x="578" dy="0">穿线孔 1.7 × 7</tspan></text>
<rect x="470" y="620" width="26" height="86" rx="2" fill="#cfd8e6" stroke="#3a6ba8" stroke-width="1.4"/>
<text x="462" y="612" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11" fill="#3a6ba8" font-weight="400" text-anchor="end" opacity="1"><tspan x="462" dy="0">J1 屏座</tspan></text>
<rect x="640" y="630" width="80" height="80" rx="3" fill="#2b2b2b" stroke="#111" stroke-width="1.4"/>
<text x="680" y="678" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#f0f0f0" font-weight="400" text-anchor="middle" opacity="1"><tspan x="680" dy="0">U1</tspan></text>
<rect x="770" y="610" width="78" height="98" rx="2" fill="#3a3a3a" stroke="#111" stroke-width="1.4"/>
<text x="809" y="664" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#f0f0f0" font-weight="400" text-anchor="middle" opacity="1"><tspan x="809" dy="0">U2</tspan></text>
<text x="809" y="692" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="10.5" fill="#d8d8d8" font-weight="400" text-anchor="middle" opacity="1"><tspan x="809" dy="0">P25D80H</tspan></text>
<rect x="628" y="740" width="34" height="16" rx="2" fill="#c8a24a" stroke="#8a6d24" stroke-width="1.4"/>
<text x="645" y="774" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="10.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" opacity="1"><tspan x="645" dy="0">C1</tspan></text>
<rect x="676" y="740" width="34" height="16" rx="2" fill="#c8a24a" stroke="#8a6d24" stroke-width="1.4"/>
<text x="693" y="774" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="10.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" opacity="1"><tspan x="693" dy="0">C2</tspan></text>
<rect x="500" y="584" width="32" height="14" rx="2" fill="#3a3a3a" stroke="#111" stroke-width="1.4"/>
<text x="516" y="576" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="10.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" opacity="1"><tspan x="516" dy="0">R1</tspan></text>
<circle cx="700" cy="576" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="700" cy="804" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="740" cy="576" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="740" cy="804" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="780" cy="576" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="780" cy="804" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="820" cy="576" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="820" cy="804" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="860" cy="576" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<circle cx="860" cy="804" r="9" fill="#cfd8e6" stroke="#3a6ba8"/>
<text x="888" y="582" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11" fill="#3a6ba8" font-weight="400" text-anchor="start" opacity="1"><tspan x="888" dy="0">JP3</tspan></text>
<text x="888" y="808" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11" fill="#3a6ba8" font-weight="400" text-anchor="start" opacity="1"><tspan x="888" dy="0">JP2</tspan></text>
<rect x="960" y="620" width="40" height="22" rx="2" fill="#cfd8e6" stroke="#3a6ba8" stroke-width="1.4"/>
<rect x="960" y="738" width="40" height="22" rx="2" fill="#cfd8e6" stroke="#3a6ba8" stroke-width="1.4"/>
<text x="1032" y="636" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11" fill="#3a6ba8" font-weight="400" text-anchor="start" opacity="1"><tspan x="1032" dy="0">JP1</tspan></text>
<circle cx="1001" cy="690" r="16" fill="#f4f1e6" stroke="#5a5346" stroke-width="1.4"/>
<line x1="556" y1="690" x2="500" y2="690" stroke="#c0398a" stroke-width="2.4" stroke-dasharray="7 4"/>
<text x="48" y="856" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="48" dy="0">说明</tspan></text>
<text x="48" y="880" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#4a4438" font-weight="400" text-anchor="start" opacity="1"><tspan x="48" dy="0">1. 板厚 2.0 mm 由用户实测，因此 USB-A 插头直接以 PCB 板边成型，无需垫片。</tspan><tspan x="48" dy="21">2. 正面只有三样东西：USB 触点、屏、触摸电极；其余器件全在背面。</tspan><tspan x="48" dy="21">3. 触摸电极是 PCB 的一部分，尺寸 13 × 5.9 mm，覆盖板宽，位置在最外端；电极是阻焊层下的网格铜箔，表面无开窗。</tspan><tspan x="48" dy="21">4. 穿线孔 1.7 × 7 mm 位于板中部、flash 左侧，屏 FPC 由此穿过到背面屏座。</tspan><tspan x="48" dy="21">5. 触摸端居中另有一个穿透板面的圆孔，直径未测（照片中可见，正反两面在同一位置）。</tspan><tspan x="48" dy="21">6. 背面各器件的相对位置按厂商渲染图与描述复原，未逐点测绘，可作参考不作依据。</tspan></text>
</svg>
