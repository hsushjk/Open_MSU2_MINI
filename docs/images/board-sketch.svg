<text x="240" y="552" font-family="'Consolas','Cascadia Mono',monospace" font-size="10" fill="#666" font-weight="400" text-anchor="middle" opacity="1"><tspan x="240" dy="0">5</tspan></text>
<text x="340" y="552" font-family="'Consolas','Cascadia Mono',monospace" font-size="10" fill="#666" font-weight="400" text-anchor="middle" opacity="1"><tspan x="340" dy="0">10 mm</tspan></text>
<text x="48" y="570" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="48" dy="0">说明</tspan></text>
<text x="48" y="594" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#4a4438" font-weight="400" text-anchor="start" opacity="1"><tspan x="48" dy="0">1. 板厚与 USB 插头的加厚方式未实测：USB-A 插头要求厚约 2.0 mm，本板若仅 1.6 mm 需加垫片。</tspan><tspan x="48" dy="21">2. 前端触点直接做在板边铜箔上，无连接器；触点区至插入端约 12 mm，属 USB-A 规范的插合长度。</tspan><tspan x="48" dy="21">3. 屏模组外形按市售 0.96 英寸 160×80 模组（约 24 × 13.5 mm）推算，比板宽略大，实物需核对。</tspan><tspan x="48" dy="21">4. U1 / U2 / U3、三组排针焊盘与触摸电极的板面位置未测绘；连线关系见 docs/PINOUT.md 与 netlist.csv。</tspan></text>
</svg>
