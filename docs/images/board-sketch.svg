<text x="522" y="348" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#5b5347" font-weight="400" text-anchor="start" opacity="1"><tspan x="522" dy="0">TP1 焊盘</tspan><tspan x="522" dy="16">固件采样 ADC 通道 9</tspan></text>
