<text x="702" y="184" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="702" dy="0">显示</tspan></text>
<text x="702" y="206" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#5b5347" font-weight="400" text-anchor="start" opacity="1"><tspan x="702" dy="0">屏 0.96 英寸 160×80，ST7735S，8 脚 0.5 mm FPC</tspan></text>
<rect x="784" y="232" width="330" height="150" rx="6" fill="#ffffff" stroke="#3a6ba8" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="949" y="300" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13.5" fill="#3a6ba8" font-weight="400" text-anchor="middle" opacity="1"><tspan x="949" dy="0">可视区 160 × 80</tspan></text>
<text x="949" y="322" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#3a6ba8" font-weight="400" text-anchor="middle" opacity="1"><tspan x="949" dy="0">约 21.7 × 10.9 mm</tspan></text>
<rect x="790" y="384" width="320" height="14" rx="6" fill="#cfd8e6" stroke="#3a6ba8" stroke-width="1.4"/>
<text x="950" y="380" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="10.5" fill="#3a6ba8" font-weight="400" text-anchor="middle" opacity="1"><tspan x="950" dy="0">J1  8P FPC 座</tspan></text>
<rect x="690" y="410" width="470" height="50" rx="4" fill="#f6f6f6" stroke="#7a7264" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="702" y="440" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#5b5347" font-weight="400" text-anchor="start" opacity="1"><tspan x="702" dy="0">JP1 / JP2 / JP3：2.54 mm 焊盘阵列，板上无器件</tspan></text>
<line x1="300" y1="496" x2="1180" y2="496" stroke="#888" stroke-width="1"/>
<line x1="300" y1="486" x2="300" y2="506" stroke="#888" stroke-width="1.4"/>
<line x1="1180" y1="486" x2="1180" y2="506" stroke="#888" stroke-width="1.4"/>
<text x="740" y="516" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#666" font-weight="400" text-anchor="middle" opacity="1"><tspan x="740" dy="0">约 54 mm（估测）</tspan></text>
<line x1="1204" y1="140" x2="1204" y2="470" stroke="#888" stroke-width="1"/>
<line x1="1194" y1="140" x2="1214" y2="140" stroke="#888" stroke-width="1.4"/>
<line x1="1194" y1="470" x2="1214" y2="470" stroke="#888" stroke-width="1.4"/>
<text x="1220" y="312" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#666" font-weight="400" text-anchor="start" opacity="1" transform="rotate(90 1220 312)"><tspan x="1220" dy="0">约 18 mm</tspan></text>
<text x="60" y="556" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="60" dy="0">说明</tspan></text>
<text x="60" y="580" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="12" fill="#4a4438" font-weight="400" text-anchor="start" opacity="1"><tspan x="60" dy="0">1. 器件面为正面，屏经 8 脚 0.5 mm FPC 直贴主板，未见背光升压电路。</tspan><tspan x="60" dy="22">2. 背光由 5 V 经 R1 = 5.1 Ω 限流直驱，无开关管，因此无法调光。</tspan><tspan x="60" dy="22">3. TP1 为板边覆铜焊盘，原理图网络名为 Touch1，固件按 ADC 通道 9 采样。</tspan><tspan x="60" dy="22">4. JP1 / JP2 / JP3 只有焊盘，未焊排针；ISP 短接盘位于 USB_D+ 与 3.3 V 之间。</tspan></text>
</svg>
