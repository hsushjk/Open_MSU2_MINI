<text x="48" y="74" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="start" opacity="1"><tspan x="48" dy="0">尺寸据实物照片估测，约 54 × 18 mm，板厚约 1.6 mm。分区位置为示意排列，不是测绘结果</tspan></text>
<polygon points="60,196 300,196 300,140 1180,140 1180,470 300,470 300,414 60,414" fill="#f4f1e6" stroke="#5a5346" stroke-width="1.8"/>
