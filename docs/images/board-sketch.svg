<text x="332" y="184" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="332" dy="0">电源</tspan></text>
<text x="332" y="206" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#5b5347" font-weight="400" text-anchor="start" opacity="1"><tspan x="332" dy="0">U3 XC6206P33</tspan><tspan x="332" dy="16">C1 / C2 10 µF</tspan></text>
<rect x="320" y="300" width="170" height="150" rx="4" fill="#eef7ef" stroke="#7a7264" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="332" y="326" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="600" text-anchor="start" opacity="1"><tspan x="332" dy="0">主控</tspan></text>
<text x="332" y="348" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5" fill="#5b5347" font-weight="400" text-anchor="start" opacity="1"><tspan x="332" dy="0">U1 QFN-20</tspan><tspan x="332" dy="16">48 MHz</tspan></text>
<rect x="510" y="158" width="160" height="122" rx="4" fill="#eef4fb" stroke="#7a7264" stroke-width="1.2" stroke-dasharray="6 4"/>
